# ============================================================
# render.yaml — Render Blueprint (dùng thay railway.toml nếu deploy Render)
# Docs: https://render.com/docs/blueprint-spec
#
# File này nằm trong 06-lab-complete/ chứ không ở gốc repo:
# khi tạo Blueprint, đặt "Blueprint Path" = 06-lab-complete/render.yaml
# ============================================================
services:
  # ── Agent ─────────────────────────────────────────────
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh key ngẫu nhiên, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # ── Redis (Render Key Value) ──────────────────────────
  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: noeviction      # không tự xoá key rate limit / cost
    ipAllowList: []                  # chỉ cho service nội bộ kết nối
